version: 2
updates:
  # All ecosystems target `develop`, not `main`. Dependabot PRs raised against
  # `main` bypass the develop -> main promotion flow entirely (see
  # .github/workflows/promote.yml) and skip the owner's review.
  - package-ecosystem: "npm"
    directory: "/typescript"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/python"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "gomod"
    directory: "/go"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
