            - heading "FAQs" [level=2] [ref=e585]
            - heading "1. What is a short code?" [level=4] [ref=e586]
            - paragraph [ref=e587]: A short code is the unique number allocated to a pay bill or buy goods organization through which they receive customer payments. It could be a Pay bill, Buy Goods, or Till Number.
            - heading "2. What is C2B?" [level=4] [ref=e588]
            - paragraph [ref=e589]: C2B, also referred to as Customer to Business payment, is a payment from a customer wallet to the merchant’s short code.
            - heading "3. What is the difference between C2B v1 and C2B v2?" [level=4] [ref=e590]
            - list [ref=e591]:
              - listitem [ref=e592]:
                - strong [ref=e593]: "C2B v1:"
                - text: The result sent to the Confirmation and Validation URL includes a SHA 256 hashed MSISDN (e.g., 94c2c311d522da950619227b3361752a42042db7e1e699b26e628305c68a88).
              - listitem [ref=e594]:
                - strong [ref=e595]: "C2B v2:"
                - text: The result includes a masked MSISDN (e.g., 2547
                - strong [ref=e596]: "*"
                - text: 126).
              - listitem [ref=e597]: The result is posted with a POST request method in application/json format.
            - heading "4. How often should I register URLs?" [level=4] [ref=e598]
            - list [ref=e599]:
              - listitem [ref=e600]:
                - strong [ref=e601]: "Sandbox:"
                - text: Register URLs before each simulation.
              - listitem [ref=e602]:
                - strong [ref=e603]: "Production:"
                - text: Register once and re-register after deletion of the already registered URLs.
            - heading "5. How do I delete URLs?" [level=4] [ref=e604]
            - paragraph [ref=e605]:
              - text: URL deletion is self-managed on the Daraja portal under
              - strong [ref=e606]: SELF SERVICES
              - text: tab >
              - strong [ref=e607]: URL Management
              - text: "button:"
              - link "https://developer.safaricom.co.ke/SelfServices?tab=urlmanagement" [ref=e608] [cursor=pointer]:
                - /url: https://developer.safaricom.co.ke/SelfServices?tab=urlmanagement
              - text: "You need two operators assigned either Business Manager or Business Administrator role on the M-PESA portal:"
              - link "https://org.ke.m-pesa.com/orglogin.action" [ref=e609] [cursor=pointer]:
                - /url: https://org.ke.m-pesa.com/orglogin.action
              - text: to validate the deletion request.
            - heading "6. Am a merchant, how can I enable validation on my short code?" [level=4] [ref=e610]
            - paragraph [ref=e611]:
              - text: To get external validation, send an email request via
              - link "APISupport@safaricom.co.ke" [ref=e612] [cursor=pointer]:
                - /url: mailto:APISupport@safaricom.co.ke
              - text: .
            - heading "7. How long does it take to enable validation?" [level=4] [ref=e613]
            - paragraph [ref=e614]: It takes approximately 6 hours.
            - heading "8. Why am I not receiving notifications to my confirmation and validation URLs?" [level=4] [ref=e615]
            - paragraph [ref=e616]: The URL you are using could be invalid. Create a valid URL and consider the information below.
            - paragraph [ref=e617]:
              - strong [ref=e618]: "URL Requirements:"
            - list [ref=e619]:
              - listitem [ref=e620]: Use publicly available (Internet-accessible) IP addresses or domain names.
              - listitem [ref=e621]: All Production URLs must be HTTPS; on Sandbox, you can use HTTP.
              - listitem [ref=e622]: Avoid using keywords such as M-PESA, M-Pesa, mpesa, Safaricom, exe, exec, cmd, sql, query, or any of their variants in your URLs.
              - listitem [ref=e623]: Do not use public URL testers (e.g., ngrok, mockbin, requestbin), especially on production. These are usually blocked by the API. Use your own application URLs and do not make them public or share with peers.
            - heading "9. What is validation URL?" [level=4] [ref=e624]
            - paragraph [ref=e625]:
              - text: Validation URL is the URL that receives the validation request from API upon payment submission. The validation URL is only called if external validation on the registered short code is enabled.
              - text: (By default, External Validation is disabled)
              - strong [ref=e626]: "URL format:"
              - link "https://ip" [ref=e627] [cursor=pointer]:
                - /url: https://ip
              - text: or domain:port/path
            - heading "10. What is Confirmation URL?" [level=4] [ref=e628]
            - paragraph [ref=e629]:
              - text: Confirmation URL is the URL that receives the confirmation request from API upon payment completion.
              - strong [ref=e630]: "URL format:"
              - link "https://ip" [ref=e631] [cursor=pointer]:
                - /url: https://ip
              - text: or domain:port/path
            - heading "11. How do I get my Mpesa username or Business Administrator username?" [level=4] [ref=e632]
            - paragraph [ref=e633]: "For an administrator to be created on the M-PESA Organization Portal, the following details are required:"
            - list [ref=e634]:
              - listitem [ref=e635]: An official request letter on company letterhead signed and stamped by authorized signatories.
              - listitem [ref=e636]:
                - text: "The letter should include:"
                - list [ref=e637]:
                  - listitem [ref=e638]: Organization Short code
                  - listitem [ref=e639]: Organization name
                  - listitem [ref=e640]: Administrator's Username
                  - listitem [ref=e641]: First name
                  - listitem [ref=e642]: Middle name (not mandatory)
                  - listitem [ref=e643]: Last name
                  - listitem [ref=e644]: ID type (National ID, Passport, etc.) scanned front and back
                  - listitem [ref=e645]: ID number
                  - listitem [ref=e646]: Nationality
                  - listitem [ref=e647]: Date of Birth
                  - listitem [ref=e648]: Email address
                  - listitem [ref=e649]: Administrator phone number
            - paragraph [ref=e650]:
              - text: Send the letter to
              - link "M-PESABusiness@Safaricom.co.ke" [ref=e651] [cursor=pointer]:
                - /url: mailto:M-PESABusiness@Safaricom.co.ke
