          - generic [ref=e97]:
            - heading "Overview" [level=2] [ref=e98]
            - paragraph [ref=e99]: The Customer to Business (C2B) API, also known as the Register URL API, enables merchants to receive notifications for successful payments to their Paybill or Till numbers. Funds originate from the customer wallet and are transferred to the merchant’s short code. Payments can be initiated via SIM Toolkit, Mpesa App, Safaricom App, USSD, NI Push API, or Dynamic QR Code API.
            - paragraph [ref=e100]: "The C2B API allows you to register callback URLs for payment notifications:"
            - list [ref=e101]:
              - listitem [ref=e102]:
                - strong [ref=e103]: Validation URL
                - text: ": Used when a merchant needs to validate payment details before accepting (e.g., verifying an account number)."
              - listitem [ref=e104]:
                - strong [ref=e105]: Confirmation URL
                - text: ": Receives payment notification after successful completion."
            - blockquote [ref=e106]:
              - paragraph [ref=e107]:
                - strong [ref=e108]: "Note:"
                - text: C2B Transaction Validation is optional and must be activated by emailing
                - link "apisupport@safaricom.co.ke" [ref=e109] [cursor=pointer]:
                  - /url: mailto:apisupport@safaricom.co.ke
                - text: or
                - link "M-pesabusiness@safaricom.co.ke" [ref=e110] [cursor=pointer]:
                  - /url: mailto:M-pesabusiness@safaricom.co.ke
                - text: .
            - heading "How It Works" [level=2] [ref=e111]
            - list [ref=e112]:
              - listitem [ref=e113]: Customer initiates payment to a Paybill or Till number.
              - listitem [ref=e114]: M-PESA validates the request internally.
              - listitem [ref=e115]: M-PESA checks if External Validation is enabled for the Paybill.
              - listitem [ref=e116]:
                - text: "If enabled:"
                - list [ref=e117]:
                  - listitem [ref=e118]: Sends a Validation request to the registered Validation URL.
                  - listitem [ref=e119]: Merchant system validates and responds (within ~8 seconds).
                  - listitem [ref=e120]: M-PESA processes the transaction based on the response.
                  - listitem [ref=e121]: If default action is "Completed", sends a Confirmation request to the Confirmation URL.
                  - listitem [ref=e122]: If default action is "Cancelled", cancels the transaction.
              - listitem [ref=e123]: If External Validation is disabled, M-PESA completes the transaction and sends a Confirmation request.
              - listitem [ref=e124]: If unable to reach the merchant’s endpoint, M-PESA uses the default action value.
              - listitem [ref=e125]: If no URLs are registered, M-PESA completes the request.
              - listitem [ref=e126]: SMS notifications are sent to both customer and merchant.
              - listitem [ref=e127]:
                - text: For failed notifications, use Pull Transaction API or check the
                - link "M-PESA Org portal" [ref=e128] [cursor=pointer]:
                  - /url: https://org.ke.m-pesa.com/login.action
                - text: .
            - paragraph [ref=e129]:
              - strong [ref=e130]: "URL Requirements:"
            - list [ref=e131]:
              - listitem [ref=e132]: Use publicly available IP addresses or domain names.
              - listitem [ref=e133]: Production URLs must be HTTPS; Sandbox allows HTTP.
              - listitem [ref=e134]: Avoid keywords like M-PESA, Safaricom, exe, exec, cmd, SQL, query, etc., in URLs.
              - listitem [ref=e135]: Do not use public URL testers (e.g., ngrok, mockbin, requestbin) in production.
            - blockquote [ref=e136]:
              - paragraph [ref=e137]:
                - strong [ref=e138]: "Note:"
                - text: On the sandbox, you are free to register your URLs multiple times or even overwrite the existing ones. In the production environment, this is a one-time API call that registers your validation and confirmation URLs to have them changed you can delete them on the URL management tab under self-service and re-register using register URL API, you can also email us at
                - link "apisupport@safaricom.co.ke" [ref=e139] [cursor=pointer]:
                  - /url: mailto:apisupport@safaricom.co.ke
                - text: for assistance.
            - blockquote [ref=e140]:
              - paragraph [ref=e141]:
                - strong [ref=e142]: "Note:"
                - text: As you set up the default value, the words "Cancelled/Completed" must be in sentence case and well-spelled.
            - heading "Getting Started" [level=2] [ref=e143]
            - heading "Prerequisites" [level=3] [ref=e144]
            - list [ref=e145]:
              - listitem [ref=e146]: Create a Daraja Account on Safaricom Developer Portal.
              - listitem [ref=e147]: Create a sandbox app to get API credentials.
              - listitem [ref=e148]: Retrieve Consumer Key & Consumer Secret.
              - listitem [ref=e149]: Use test data from the simulator section.
              - listitem [ref=e150]: Have a live M-PESA Paybill/Till number with Business Admin/Manager operators for Go Live.
            - heading "Good to Know" [level=3] [ref=e151]
            - list [ref=e152]:
              - listitem [ref=e153]: The API is asynchronous.
              - listitem [ref=e154]: Can be consumed over the internet, VPN, or Multiprotocol Switch.
            - heading "Get Auth Token" [level=4] [ref=e155]
            - paragraph [ref=e156]:
              - text: Generate an access token to authenticate API calls. See
              - link "Authorization API" [ref=e157] [cursor=pointer]:
                - /url: https://daraja.safaricom.co.ke/dashboard/apis?api=Authorization
              - text: .
            - heading "Integration Steps" [level=2] [ref=e158]
