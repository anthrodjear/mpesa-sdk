                - text: After receiving the validation request, you are required to process it and respond to the API call and inform M-PESA either to accept or reject the payment. To accept, you send the below JSON making sure the value of ResultCode is 0 (zero), but the value of ResultDesc is Accepted.
                - code [ref=e347]: "{ \"ResultCode\": \"0\", \"ResultDesc\": \"Accepted\" }"
              - listitem [ref=e348]:
                - text: "To reject a transaction, you send the same JSON above, but with the ResultCode set as C2B00011 (or any other value from the error table below), BUT NOT 0. The ResultDesc should be set as Rejected as shown below:"
