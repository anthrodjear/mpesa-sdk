            - heading "How to apply for a live pay bill number/till number or B2C Account" [level=2] [ref=e1047]
            - paragraph [ref=e1048]:
              - text: "Apply here:"
              - link "M-PESABusiness@Safaricom.co.ke" [ref=e1049] [cursor=pointer]:
                - /url: mailto:M-PESABusiness@Safaricom.co.ke
            - heading "Support" [level=2] [ref=e1050]
            - heading "Chatbot" [level=3] [ref=e1051]
            - paragraph [ref=e1052]: Developers can get instant responses using the Daraja Chatbot for both development and production support.
            - heading "Production Issues & Incident Management" [level=3] [ref=e1053]
            - paragraph [ref=e1054]: "For production support and incident management, use:"
            - list [ref=e1055]:
              - listitem [ref=e1056]:
                - strong [ref=e1057]: "Incident Management Page:"
                - text: Visit the
                - link "Incident Management" [ref=e1058] [cursor=pointer]:
                  - /url: https://daraja.safaricom.co.ke/dashboard/incidentmanagement
                - text: page.
              - listitem [ref=e1059]:
                - strong [ref=e1060]: "Email:"
                - text: Reach out to API support at
                - link "apisupport@safaricom.co.ke" [ref=e1061] [cursor=pointer]:
                  - /url: mailto:apisupport@safaricom.co.ke
                - text: .
            - heading "Frequently Asked Questions (FAQs)" [level=3] [ref=e1062]
            - list [ref=e1063]:
              - listitem [ref=e1064]:
                - paragraph [ref=e1065]:
                  - strong [ref=e1066]: Why am I not receiving callbacks on my B2C ResultURL?
                  - text: Ensure your callback endpoint (ResultURL) is publicly accessible over the internet. Use a valid IP address or domain name, and confirm your server is reachable.
              - listitem [ref=e1067]:
                - paragraph [ref=e1068]:
                  - strong [ref=e1069]: What should I do if I encounter an invalid access token error?
                - list [ref=e1070]:
                  - listitem [ref=e1071]: Check that your access token has not expired (tokens expire hourly).
                  - listitem [ref=e1072]: Ensure you are using the correct consumer key and consumer secret to generate the token.
              - listitem [ref=e1073]:
                - paragraph [ref=e1074]:
                  - strong [ref=e1075]: Can I use my actual B2C short code on the Daraja portal simulator?
                  - text: No. The simulator supports only sandbox test short codes. Use your application or a REST client (e.g., Postman) for live short code testing.
              - listitem [ref=e1076]:
                - paragraph [ref=e1077]:
                  - strong [ref=e1078]: How do I know if the B2C request is successful?
                  - text: The B2C API is asynchronous. You receive an acknowledgement immediately, but the actual transaction result is sent later to your specified ResultURL. A successful transaction has ResultCode 0.
              - listitem [ref=e1079]:
                - paragraph [ref=e1080]:
                  - strong [ref=e1081]: Is there a test environment for B2C API?
                  - text: Yes. Use the sandbox environment and test credentials provided on the Daraja developer portal. You can test via the simulator, your code, or any REST client.
              - listitem [ref=e1082]:
                - paragraph [ref=e1083]:
                  - strong [ref=e1084]: Why am I getting a balance insufficient error, yet I have money in my B2C account?
                  - text: B2C transactions debit the Utility account. Ensure sufficient funds are available in the Utility account, not just the MMF/Working account.
              - listitem [ref=e1085]:
                - paragraph [ref=e1086]:
                  - strong [ref=e1087]: How do I move funds from MMF/Working account to Utility account for B2C disbursement?
                  - text: "Log in to the M-PESA portal as a Business Web Operator:"
                - list [ref=e1088]:
                  - listitem [ref=e1089]: Go to My Functions > Initiate Transaction
                  - listitem [ref=e1090]: Select "Business Services – Move Funds from MMF Account to Utility Account"
                  - listitem [ref=e1091]: Enter required details and submit
                  - listitem [ref=e1092]:
                    - text: Another operator must approve the transaction under My Tasks > Group Task
                    - text: This can also be automated via the B2B API.
              - listitem [ref=e1093]:
                - paragraph [ref=e1094]:
                  - strong [ref=e1095]: Can I automate the funds transfer from MMF/Working account to Utility account?
                  - text: Yes. Use the B2B API with CommandID
                  - strong [ref=e1096]:
                    - emphasis [ref=e1097]: BusinessTransferFromMMFToUtility
                  - text: . Contact
                  - link "apisupport@safaricom.co.ke" [ref=e1098] [cursor=pointer]:
                    - /url: mailto:apisupport@safaricom.co.ke
                  - text: for whitelisting.
              - listitem [ref=e1099]:
                - paragraph [ref=e1100]:
                  - strong [ref=e1101]: What are the minimum and maximum limits for B2C transaction amounts?
                - list [ref=e1102]:
                  - listitem [ref=e1103]: "Minimum: Ksh 10"
                  - listitem [ref=e1104]: "Maximum per transaction: Ksh 250,000"
                  - listitem [ref=e1105]: "Maximum customer account balance: Ksh 500,000"
                  - listitem [ref=e1106]: "Maximum daily value: Ksh 500,000"
              - listitem [ref=e1107]:
                - paragraph [ref=e1108]:
                  - strong [ref=e1109]: Which API role is required for B2C requests?
                  - text: Assign the
                  - strong [ref=e1110]:
                    - emphasis [ref=e1111]: ORG B2C API initiator
                  - text: role to your API user (done by the Business Administrator).
              - listitem [ref=e1112]:
                - paragraph [ref=e1113]:
                  - strong [ref=e1114]: My API user is showing pending active status; how do I activate it?
                  - text: The API user must have their password set by a user with the Set
                  - strong [ref=e1115]:
                    - emphasis [ref=e1116]: Restricted ORG API PASSWORD
                  - text: role. Once set, the status changes to active.
              - listitem [ref=e1117]:
                - paragraph [ref=e1118]:
                  - strong [ref=e1119]: Why am I getting "initiator information is invalid" error?
                  - text: "This means the API user credentials are incorrect. Check:"
                - list [ref=e1120]:
                  - listitem [ref=e1121]: Username
                  - listitem [ref=e1122]: Encrypted password
                  - listitem [ref=e1123]: Encryption algorithm/certificate (use the tool on the developer portal)
              - listitem [ref=e1124]:
                - paragraph [ref=e1125]:
                  - strong [ref=e1126]: Why am I getting "security credential is locked" error?
                  - text: Multiple failed login attempts lock the API user password. The Business Administrator can unlock it on the M-PESA portal. Ensure the correct password is used.
              - listitem [ref=e1127]:
                - paragraph [ref=e1128]:
                  - strong [ref=e1129]: How do I resolve "Invalid API call as no apiproduct match found" error?
                - list [ref=e1130]:
                  - listitem [ref=e1131]: For production, ensure the B2C product is enabled on your Daraja app.
                  - listitem [ref=e1132]: Verify you are calling the correct API endpoint.
              - listitem [ref=e1133]:
                - paragraph [ref=e1134]:
                  - strong [ref=e1135]: Do I need a passkey for B2C?
                  - text: No. Passkey is only required for M-PESA Express/STK Push API.
              - listitem [ref=e1136]:
                - paragraph [ref=e1137]:
                  - strong [ref=e1138]: Why is the B2C product missing when I try to Go Live with my pay bill?
                  - text: Your pay bill may not have B2C permissions. You need a B2C or one account short code. Apply via
                  - link "https://m-pesaforbusiness.co.ke/" [ref=e1139] [cursor=pointer]:
                    - /url: https://m-pesaforbusiness.co.ke/
                  - text: .
              - listitem [ref=e1140]:
                - paragraph [ref=e1141]:
                  - strong [ref=e1142]: Can I reverse a B2C transaction using the Reversal API?
                  - text: No. B2C reversals are not supported via API and must be done manually on the M-PESA portal.
              - listitem [ref=e1143]:
                - paragraph [ref=e1144]:
                  - strong [ref=e1145]: Why am I getting "Bad Request - Invalid InitiatorName" error?
                  - text: "Possible causes:"
                - list [ref=e1146]:
                  - listitem [ref=e1147]: Wrong Content-Type (should be application/json)
                  - listitem [ref=e1148]: Incorrect parameter name
                  - listitem [ref=e1149]: Invalid or missing InitiatorName value
              - listitem [ref=e1150]:
                - paragraph [ref=e1151]:
                  - strong [ref=e1152]: Can I have both B2C and C2B on my Daraja application?
                  - text: Yes, if both functionalities are enabled for your short code.
              - listitem [ref=e1153]:
                - paragraph [ref=e1154]:
                  - strong [ref=e1155]: Which operator can create an API user?
                  - text: Only the Business Administrator can create API users. Any web user with the Set Restricted ORG API PASSWORD role can set the password.
              - listitem [ref=e1156]:
                - paragraph [ref=e1157]:
                  - strong [ref=e1158]: Do I need to generate the security credential for every B2C request?
                  - text: No. You can reuse the same security credential for multiple requests.
              - listitem [ref=e1159]:
                - paragraph [ref=e1160]:
                  - strong [ref=e1161]: Do I need to manually approve B2C requests initiated via API?
                  - text: No. Manual approval is not required for API-initiated B2C requests.
              - listitem [ref=e1162]:
                - paragraph [ref=e1163]:
                  - strong [ref=e1164]: Can I check B2C transaction status using the Transaction Status Query API?
                  - text: Yes. Use the OriginatorConversationID or the M-PESA Receipt Number.
              - listitem [ref=e1165]:
                - paragraph [ref=e1166]:
                  - strong [ref=e1167]: Is there an API for moving money from a pay bill number to a B2C short code?
                  - text: Yes. Use the B2C Account Top Up API to move funds from your pay bill’s Working account to the B2C Utility account. See
                  - link "B2C Account Top Up API documentation" [ref=e1168] [cursor=pointer]:
                    - /url: https://developer.safaricom.co.ke/APIs/B2CAccountTopUp
                  - text: .
      - generic [ref=e127]:
        - paragraph [ref=e128]: Daraja 3.0
        - paragraph [ref=e129]: Daraja 3.0 is a web platform that offers access to Safaricom and M-PESA APIs that creates a bridge for payment integration to web and mobile apps. By connecting to our APIs, you open a world of possibilities to you and your clients. Together, we can transform lives.
