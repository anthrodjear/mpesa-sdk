            - heading "GO LIVE" [level=3] [ref=e871]
            - paragraph [ref=e872]:
              - strong [ref=e873]: Time to launch, here Dev you need help from the business teams no more Rambo stunts behind the keyboard. Some collaboration will do; a handshake to the business team in the morning it is. Wait! You can act Rambo if you are both the Business and Dev
            - paragraph [ref=e874]: We’ve already tested, and finished development now attach the integration to a live pay bill/till number. Navigate to GO LIVE tab. Fill in the below fields with live data. We require a short code of a live pay bill or till number, the organization name and an M-PESA admin/manager username to successfully go live. Kindly visit our how-to section for more information on m-pesa org portal access and user creation.
            - paragraph [ref=e875]:
              - img "Go Live!" [ref=e876]
            - paragraph [ref=e877]: Upon successful go live, production endpoints will be sent to developer email and the test sandbox app will be moved to production with production consumer key and secrets. Below is how to see the production app.
            - paragraph [ref=e878]:
              - strong [ref=e879]: We’ve successfully deployed dev congratulations we are now live!
            - heading "How To" [level=2] [ref=e880]
            - paragraph [ref=e881]:
              - strong [ref=e882]: Access to the M-PESA Organization Portal and create Users
            - paragraph [ref=e883]: The M-PESA organization portal is a platform designed for businesses and organizations to manage their financial transactions through the M-PESA services.
            - paragraph [ref=e884]: "The portal offers various features for businesses, including:"
            - list [ref=e885]:
              - listitem [ref=e886]: "Transaction Management: Monitor and manage transactions, generate reports, and reconcile accounts."
              - listitem [ref=e887]: "Account Management: Manage multiple user accounts with different access levels within the organization."
              - listitem [ref=e888]: "Bulk Payments: Facilitate bulk payments to employees, suppliers, and other beneficiaries efficiently."
            - paragraph [ref=e889]:
              - strong [ref=e890]: Access to the M-PESA Organization Portal
            - paragraph [ref=e891]:
              - img "org-portal!" [ref=e892]
            - paragraph [ref=e893]:
              - text: To access the Organization portal (
              - link "https://org.ke.m-pesa.com/orglogin.action" [ref=e894] [cursor=pointer]:
                - /url: https://org.ke.m-pesa.com/orglogin.action
              - text: ), you need to have a Business Administrator role created under your business short code (Pay Bill/ Till).
            - paragraph [ref=e895]: The first step before getting access, is to ensure the settlement option set to your short code is Bank via a Head Office application.
            - paragraph [ref=e896]:
              - text: To make an application for a Head Office for your short code/Store Number kindly contact
              - link "M-PESABusiness@Safaricom.co.ke" [ref=e897] [cursor=pointer]:
                - /url: mailto:M-PESABusiness@Safaricom.co.ke
              - text: where they will provide you with the forms to be filled.
            - paragraph [ref=e898]:
              - text: After Head Office is created the
              - link "M-PESABusiness@Safaricom.co.ke" [ref=e899] [cursor=pointer]:
                - /url: mailto:M-PESABusiness@Safaricom.co.ke
              - text: will also guide on the creation of the Business Administrator (username).
            - paragraph [ref=e900]:
              - strong [ref=e901]: "How to login to M-PESA Organization Portal For the first time:"
            - list [ref=e902]:
              - listitem [ref=e903]:
                - text: "Launch the link from any of the browsers:"
                - link "https://org.ke.m-pesa.com" [ref=e904] [cursor=pointer]:
                  - /url: https://org.ke.m-pesa.com
                - text: .
              - listitem [ref=e905]: Enter the Short code which is Bulk payment number.
              - listitem [ref=e906]: Enter the Business Administrator username received
            - paragraph [ref=e907]:
              - text: To make an application for a Head Office for your short code/Store Number kindly contact
              - link "M-PESABusiness@Safaricom.co.ke" [ref=e908] [cursor=pointer]:
                - /url: mailto:M-PESABusiness@Safaricom.co.ke
              - text: where they will provide you with the forms to be filled. After Head Office is created, the
              - link "M-PESABusiness@Safaricom.co.ke" [ref=e909] [cursor=pointer]:
                - /url: mailto:M-PESABusiness@Safaricom.co.ke
              - text: will also guide on the creation of the Business Administrator (username).
            - heading "How to login to M-PESA Organization Portal For the first time:" [level=2] [ref=e910]
            - list [ref=e911]:
              - listitem [ref=e912]:
                - text: "Launch the link from any of the browsers:"
                - link "https://org.ke.m-pesa.com" [ref=e913] [cursor=pointer]:
                  - /url: https://org.ke.m-pesa.com
                - text: .
              - listitem [ref=e914]: Enter the Short code which is Bulk payment number.
              - listitem [ref=e915]: Enter the Business Administrator username received on email.
              - listitem [ref=e916]: Enter the first-time password received on the same email – the Password is case-sensitive (full stop is not part of the password).
              - listitem [ref=e917]: Enter the Verification Code displayed then click login, on the Next Page.
              - listitem [ref=e918]: Enter OTP to proceed to the change password page.
              - listitem [ref=e919]: Enter the first-time password on email, then proceed to set a new password.
              - listitem [ref=e920]: Confirm password, security question, and security answer one and two which are mandatory.
              - listitem [ref=e921]: The Password must meet the password rules as instructed.
              - listitem [ref=e922]: Submit to successfully activate the Business Administrator account.
              - listitem [ref=e923]: After activation, you will only be entering your username, shortcode, and password verification code and entering the OTP received via SMS to log in.
            - heading "Account Types in C2B Organization" [level=2] [ref=e924]
            - list [ref=e925]:
              - listitem [ref=e926]:
                - paragraph [ref=e927]:
                  - strong [ref=e928]: MMF/WORKING/M-PESA ACCOUNT FOR ORGANIZATION
                - list [ref=e929]:
                  - listitem [ref=e930]: When an organization wants to make a business withdrawal, the funds are transferred to this account before the withdrawal request is made.
              - listitem [ref=e931]:
                - paragraph [ref=e932]:
                  - strong [ref=e933]: UTILITY ACCOUNT
                - list [ref=e934]:
                  - listitem [ref=e935]: Payments from customers are credited into the utility account.
              - listitem [ref=e936]:
                - paragraph [ref=e937]:
                  - strong [ref=e938]: CHARGES PAID ACCOUNT
                - list [ref=e939]:
                  - listitem [ref=e940]: For payments received from customers, depending on the tariff, a charge is levied on the Organization or is split between the organization and the customer. The charges paid account is debited and always accrues a negative balance which has to be settled before an organization can make a withdrawal request.
              - listitem [ref=e941]:
                - paragraph [ref=e942]:
                  - strong [ref=e943]: ORGANIZATION SETTLEMENT ACCOUNT
                - list [ref=e944]:
                  - listitem [ref=e945]: This account does the calculations for the organization operator when s/he initiates a revenue settlement. This account settles the charges paid account and then moves the balance from the Utility Account to the MMF account automatically. You will notice that the transaction type “Move funds from Utility to MMF” is no longer available as the revenue settlement process takes care of this.
            - heading "Various Roles under the portal" [level=2] [ref=e946]
            - heading "Business Administrator role" [level=3] [ref=e947]
            - paragraph [ref=e948]: The Business Administrator role is crucial for managing and overseeing user activities within the portal.
            - paragraph [ref=e949]:
              - strong [ref=e950]: "Responsibilities of a Business Administrator:"
            - list [ref=e951]:
              - listitem [ref=e952]:
                - text: "Create other system users and give them roles depending on what he/she wants them to do within the portal. The roles include:"
                - list [ref=e953]:
                  - listitem [ref=e954]: A Business Web Operator who can initiate transactions, access statements, and check balance.
                  - listitem [ref=e955]: A business manager.
                  - listitem [ref=e956]: A Business Auditor – View Only/ Read Only Rights.
              - listitem [ref=e957]: Not able to view transactions.
              - listitem [ref=e958]:
                - text: User created by Safaricom (
                - link "M-PESABusiness@Safaricom.co.ke" [ref=e959] [cursor=pointer]:
                  - /url: mailto:M-PESABusiness@Safaricom.co.ke
                - text: ).
            - heading "Business Manager" [level=3] [ref=e960]
            - paragraph [ref=e961]: The Business manager approves transactions, checks balances, and access statements.
            - paragraph [ref=e962]:
              - strong [ref=e963]: "Responsibilities of a Business Manager:"
            - list [ref=e964]:
              - listitem [ref=e965]: The user can View statements.
              - listitem [ref=e966]: The user can initiate transactions.
              - listitem [ref=e967]: The user can Approve/reject other transactions.
              - listitem [ref=e968]: The user can withdraw funds from M-PESA.
            - paragraph [ref=e969]:
              - strong [ref=e970]: "Proceed as below to create a business manager:"
            - list [ref=e971]:
              - listitem [ref=e972]: Log in the Organization portal as the Business administrator.
              - listitem [ref=e973]: Select operators.
            - paragraph [ref=e974]:
              - img "select-operator!" [ref=e975]
            - list [ref=e976]:
              - listitem [ref=e977]: Then click the add option.
              - listitem [ref=e978]: It will take you to a new page where you will enter the username of the operator.
              - listitem [ref=e979]: Select access channel as Web.
            - paragraph [ref=e980]:
              - img "access-channel!" [ref=e981]
            - list [ref=e982]:
              - listitem [ref=e983]: Then select web profile default rule profile.
              - listitem [ref=e984]: Then assign role...Business Manager and Set Restricted ORG API PASSWORD.
            - paragraph [ref=e985]:
              - img "assign-role!" [ref=e986]
            - list [ref=e987]:
              - listitem [ref=e988]: Enter the KYC information of the operator then submit.
            - heading "API user creation" [level=3] [ref=e989]
            - paragraph [ref=e990]:
              - strong [ref=e991]: "Proceed as below to create an API Operator:"
            - list [ref=e992]:
              - listitem [ref=e993]: Log in as the Business administrator.
              - listitem [ref=e994]: Select operators.
            - paragraph [ref=e995]:
              - img "select-operator!" [ref=e996]
            - list [ref=e997]:
              - listitem [ref=e998]: Then click the add option.
              - listitem [ref=e999]: It will take you to a new page where you will enter the username of the API initiator.
              - listitem [ref=e1000]: Select access channel as API.
              - listitem [ref=e1001]: Then select web profile default rule profile.
              - listitem [ref=e1002]: Then assign role...look for the ORG B2C API initiator, Balance Query ORG API, Transaction Status query ORG API roles.
            - paragraph [ref=e1003]:
              - img "assign-api-role!" [ref=e1004]
            - list [ref=e1005]:
              - listitem [ref=e1006]: Enter the KYC information of the operator then submit.
            - paragraph [ref=e1007]:
              - strong [ref=e1008]: "Here is how to set the password for the API user:"
            - list [ref=e1009]:
              - listitem [ref=e1010]: Login as User with the Set Restrict Password Role i.e. The Business Manager.
            - paragraph [ref=e1011]:
              - img "Operator Management!" [ref=e1012]
            - list [ref=e1013]:
              - listitem [ref=e1014]: Click on My Functions, Then Operator Management.
              - listitem [ref=e1015]: Enter the API username to search after it populates the API user, At the end click on operations.
              - listitem [ref=e1016]: Then click on set password avoid such (@ or.) in the setting of this password.
