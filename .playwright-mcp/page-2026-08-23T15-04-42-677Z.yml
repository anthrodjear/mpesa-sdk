          - generic [ref=e413]:
            - heading "Overview" [level=2] [ref=e414]
            - paragraph [ref=e415]: B2C API is used to make payments from a Business to Customers' number also known as Bulk Disbursements.
            - heading "How It Works" [level=2] [ref=e416]
            - list [ref=e417]:
              - listitem [ref=e418]: The Merchant (Partner) prepares and sends a payment request to the M-PESA B2C API endpoint.
              - listitem [ref=e419]: The API Management Platform validates, authorizes, and authenticates the request, forwards it to M-PESA, and sends an acknowledgment to the Merchant.
              - listitem [ref=e420]: M-PESA validates the request and initiator details, then processes the transaction.
              - listitem [ref=e421]: M-PESA sends the transaction response to the Merchant via the specified callback URL.
              - listitem [ref=e422]: The Customer receives an SMS notification confirming the payment
            - blockquote [ref=e423]:
              - paragraph [ref=e424]:
                - strong [ref=e425]: "Note:"
                - text: To go live and use the API in production, you must apply for a Bulk Disbursement Account and obtain a B2C Short Code or you convert your existing pay bill/till number to one account(can receive and disburse). Apply for the Bulk Disbursement Account/one account here
                - link "https://www.safaricom.co.ke/business/sme/m-pesa-payment-solutions" [ref=e426] [cursor=pointer]:
                  - /url: https://www.safaricom.co.ke/business/sme/m-pesa-payment-solutions
                - text: .
            - heading "Getting Started" [level=2] [ref=e427]
            - heading "Prerequisites" [level=3] [ref=e428]
            - list [ref=e429]:
              - listitem [ref=e430]:
                - text: Create a Daraja Account on
                - link "Safaricom Developer Portal" [ref=e431] [cursor=pointer]:
                  - /url: https://daraja.safaricom.co.ke/
                - text: .
              - listitem [ref=e432]: Create a sandbox app in the portal to get API credentials.
              - listitem [ref=e433]:
                - text: Retrieve Consumer Key & Consumer Secret from your sandbox app on
                - link "My Apps" [ref=e434] [cursor=pointer]:
                  - /url: https://daraja.safaricom.co.ke/dashboard/myapps
                - text: .
              - listitem [ref=e435]:
                - strong [ref=e436]: "Test data:"
                - text: Available on the simulator section.
              - listitem [ref=e437]:
                - strong [ref=e438]: "Initiator Username:"
                - text: This is the API operator's username as set on the portal when the user was created. For Sandbox users, the username is already created and assigned to them and is available on the test credentials page as InitiatorName.
              - listitem [ref=e439]:
                - strong [ref=e440]: "Initiator Password:"
                - text: This is the password assigned to the API operator after being created by the Business Administrator. For Sandbox users, this is available as InitiatorPassword on the test credentials page.
                - strong [ref=e441]: "Note:"
                - text: "The password should be limited to specific special characters such as #, &, %, and $. Other characters might cause issues, and the password may not be accepted. For example, using a"
                - code [ref=e442]: (
                - text: or
                - code [ref=e443]: )
                - text: character will not be accepted. In addition, @ is not a special character on M-Pesa; it is treated as a normal character.
              - listitem [ref=e444]:
                - strong [ref=e445]: "Public Key Certificate:"
                - text: This certificate is used to encrypt the Initiator's plaintext password for use in API calls. It is provided for both Sandbox and Production clients on the portal. You need to encrypt the password using your API language or use the test credentials section, which offers the capability to encrypt your password.
              - listitem [ref=e446]:
                - strong [ref=e447]: "Live M-PESA B2C shortcode, Paybill/till number:"
                - text: For Go Live, you need a shortcode or number that can receive and disburse funds (one account) with Business Admin/Manager operators created.
            - heading "Good to Know" [level=3] [ref=e448]
            - paragraph [ref=e449]: This API is asynchronous.
            - heading "Get Auth Token" [level=4] [ref=e450]
            - paragraph [ref=e451]:
              - text: Devs gather here! You will first generate an access token to authenticate you to make the API call. See below generate access token
              - link "API" [ref=e452] [cursor=pointer]:
                - /url: https://daraja.safaricom.co.ke/dashboard/apis?api=Authorization
              - text: here. We’ve also automated this on the simulate request section.
            - heading "Integration Steps" [level=2] [ref=e453]
            - heading "Sequence Diagram" [level=3] [ref=e454]
            - paragraph [ref=e455]:
              - img "business-to-customer-sequence-diagram!" [ref=e456]
            - heading "Use Cases" [level=3] [ref=e457]
            - list [ref=e458]:
              - listitem [ref=e459]:
                - paragraph [ref=e460]:
                  - strong [ref=e461]: Salary Payments
                  - text: Disbursement of employee wages from businesses to individual customer wallets or bank accounts.
              - listitem [ref=e462]:
                - paragraph [ref=e463]:
                  - strong [ref=e464]: Cashback Payments
                  - text: Automated refunds or rewards where a portion of money spent by customers is returned to their wallets as part of loyalty or promotional programs.
              - listitem [ref=e465]:
                - paragraph [ref=e466]:
                  - strong [ref=e467]: Promotional Payments
                  - text: Incentive payouts such as lottery winnings, betting rewards, or other campaign-based disbursements to customers.
              - listitem [ref=e468]:
                - paragraph [ref=e469]:
                  - strong [ref=e470]: Winnings
                  - text: Payouts from contests, games, or competitions where participants receive monetary rewards.
              - listitem [ref=e471]:
                - paragraph [ref=e472]:
                  - strong [ref=e473]: Financial Institutions Withdrawal of Funds
                  - text: Transfers initiated to move funds from a financial institution or digital wallet to a customer’s account or for cash-out purposes.
              - listitem [ref=e474]:
                - paragraph [ref=e475]:
                  - strong [ref=e476]: Loan Disbursements
                  - text: Distribution of approved loan amounts from lenders directly to borrowers’ wallets or bank accounts.
