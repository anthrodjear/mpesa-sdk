          - generic [ref=e108]:
            - heading "Overview" [level=2] [ref=e109]
            - paragraph [ref=e110]: LIPA NA M-PESA ONLINE API also known as M-PESA express is a Merchant/Business initiated C2B (Customer to Business) transaction. Once the merchant integrates to the API, they can then initiate a payment authorization prompt to a customer whose phone number is registered and active on M-PESA.
            - heading "How It Works" [level=2] [ref=e111]
            - list [ref=e112]:
              - listitem [ref=e113]: The Merchant (Partner) captures and sets the required API parameters and sends the API request.
              - listitem [ref=e114]: The API receives the request, validates it internally, and sends an acknowledgment response.
              - listitem [ref=e115]: Through the API Proxy, a network-initiated push request is sent to the M-PESA-registered phone number of the customer making the payment.
              - listitem [ref=e116]: The customer confirms the payment by entering their M-PESA PIN.
              - listitem [ref=e117]:
                - text: "The response is sent back to M-PESA and processed as follows:"
                - list [ref=e118]:
                  - listitem [ref=e119]: M-PESA validates the customer's PIN.
                  - listitem [ref=e120]: M-PESA debits the customer's mobile wallet.
                  - listitem [ref=e121]: M-PESA credits the Merchant (Partner) account.
              - listitem [ref=e122]: Once the request is processed, the results are sent back to the API Management system, which then forwards them to the merchant via the callback URL specified in the request.
              - listitem [ref=e123]: The customer receives an SMS confirmation message for the payment.
            - heading "Getting Started" [level=2] [ref=e124]
            - heading "Prerequisites" [level=3] [ref=e125]
            - list [ref=e126]:
              - listitem [ref=e127]:
                - text: Create a Daraja Account on
                - link "Safaricom Developer Portal" [ref=e128] [cursor=pointer]:
                  - /url: https://developer.safaricom.co.ke/
                - text: .
              - listitem [ref=e129]: Create a sandbox app in the portal to get API credentials.
              - listitem [ref=e130]:
                - text: Retrieve Consumer Key & Consumer Secret from your sandbox app on
                - link "My Apps" [ref=e131] [cursor=pointer]:
                  - /url: https://developer.safaricom.co.ke/dashboard/myapps
                - text: .
              - listitem [ref=e132]: Test data available on the simulator section
              - listitem [ref=e133]: Passkey for encryption of the password parameter-on sandbox this is availed on test data on the simulator, in production this will be send on developer email after go-live
              - listitem [ref=e134]: Live M-PESA pay bill/till number with Business Admin/Manager operators created - For Go live
            - heading "Good to Know" [level=3] [ref=e135]
            - paragraph [ref=e136]: This API is asynchronous. You can consume this API over the internet, a virtual private network or Multiprotocol Switch.
            - heading "Get Auth Token" [level=4] [ref=e137]
            - paragraph [ref=e138]:
              - text: Devs gather here! You will first generate an access token to authenticate you to make the API call. See below generate access token
              - link "API" [ref=e139] [cursor=pointer]:
                - /url: https://developer.safaricom.co.ke/dashboard/apis?api=Authorization
              - text: here. We’ve also automated this on the simulate request section.
            - heading "Integration Steps" [level=2] [ref=e140]
            - heading "Sequence Diagram" [level=3] [ref=e141]
            - paragraph [ref=e142]:
              - img "lipa-na-mpesa-sequence-diagram!" [ref=e143]
            - heading "Use Cases" [level=3] [ref=e144]
            - list [ref=e145]:
              - listitem [ref=e146]: Reduction of wrong payments/reversals Wrong payments are significantly reduced because customers only need to enter their M-PESA PIN to validate transactions. There's no need to remember or manually input the pay bill/till number, amount, or account number—these details are pre-set by the merchant and included in the M-PESA push request.
              - listitem [ref=e147]: Enhanced and shorter payment journey
