                - strong [ref=e728]: "Email:"
                - text: Reach out to API support at
                - link "apisupport@safaricom.co.ke" [ref=e729] [cursor=pointer]:
                  - /url: mailto:apisupport@safaricom.co.ke
                - text: .
            - heading "FAQs" [level=3] [ref=e730]
            - list [ref=e731]:
              - listitem [ref=e732]:
                - paragraph [ref=e733]:
                  - strong [ref=e734]: Why am I not receiving callbacks on my CallbackURL?
                - list [ref=e735]:
                  - listitem [ref=e736]: Ensure your CallbackURL is publicly accessible over the internet.
                  - listitem [ref=e737]: Use a valid IP address or domain name.
                  - listitem [ref=e738]: Confirm your endpoint is not blocked by firewalls or network restrictions.
              - listitem [ref=e739]:
                - paragraph [ref=e740]:
                  - strong [ref=e741]: What should I do if I encounter an invalid access token error?
                - list [ref=e742]:
                  - listitem [ref=e743]: Check that your access token has not expired (tokens expire hourly).
                  - listitem [ref=e744]: Make sure you are using the correct consumer key and consumer secret to generate the token.
              - listitem [ref=e745]:
                - paragraph [ref=e746]:
                  - strong [ref=e747]: Can I use my actual pay bill on the Daraja portal simulator?
                - list [ref=e748]:
                  - listitem [ref=e749]: No. The Daraja simulator only supports sandbox test short codes.
                  - listitem [ref=e750]: To test with your actual short code, use your application or a REST client like Postman.
              - listitem [ref=e751]:
                - paragraph [ref=e752]:
                  - strong [ref=e753]: Do you have a test environment for M-PESA Express API?
                - list [ref=e754]:
                  - listitem [ref=e755]: Yes. The sandbox environment and test credentials (including test short codes) are available on the Daraja developer portal.
                  - listitem [ref=e756]: You can test using the Daraja simulator, your application, or any REST client.
              - listitem [ref=e757]:
                - paragraph [ref=e758]:
                  - strong [ref=e759]: What are the transaction limits for M-PESA Express?
                - list [ref=e760]:
                  - listitem [ref=e761]: A registered customer can receive up to Ksh 250,000 per transaction.
                  - listitem [ref=e762]: The maximum customer account balance is Ksh 500,000.
                  - listitem [ref=e763]: The daily transaction value limit is Ksh 500,000.
                  - listitem [ref=e764]: The minimum transaction amount is Ksh 1.
              - listitem [ref=e765]:
                - paragraph [ref=e766]:
                  - strong [ref=e767]: What should I do to resolve the "Invalid API call as no apiproduct match found" error?
                - list [ref=e768]:
                  - listitem [ref=e769]: For production, ensure the Lipa na M-PESA production product is enabled on your Daraja application.
                  - listitem [ref=e770]: For Sandbox, ensure the M-PESA Express Sandbox product is enabled.
                  - listitem [ref=e771]: Verify you are calling the correct API endpoint.
              - listitem [ref=e772]:
                - paragraph [ref=e773]:
                  - strong [ref=e774]: Can I reverse an M-PESA Express transaction using the Reversal API?
                - list [ref=e775]:
                  - listitem [ref=e776]: Yes.
              - listitem [ref=e777]:
                - paragraph [ref=e778]:
                  - strong [ref=e779]: Where do I view the transaction history for M-PESA Express transactions?
                - list [ref=e780]:
                  - listitem [ref=e781]:
                    - text: "Use the M-PESA Org portal:"
                    - link "https://org.ke.m-pesa.com/" [ref=e782] [cursor=pointer]:
                      - /url: https://org.ke.m-pesa.com/
                    - text: to view all transactions for your business account.
              - listitem [ref=e783]:
                - paragraph [ref=e784]:
                  - strong [ref=e785]: Why am I getting "Bad Request - Invalid BusinessShortCode" error?
                - list [ref=e786]:
                  - listitem [ref=e787]:
                    - text: "Possible causes:"
                    - list [ref=e788]:
                      - listitem [ref=e789]: "Wrong request Content-Type. Ensure to specify Content-Type: application/json in your request headers."
                      - listitem [ref=e790]: Incorrect parameter name.
                      - listitem [ref=e791]: Invalid or missing BusinessShortCode value.
              - listitem [ref=e792]:
                - paragraph [ref=e793]:
                  - strong [ref=e794]: Can I use a Till Number for STK Push API?
                - list [ref=e795]:
                  - listitem [ref=e796]: Yes, you can integrate a Till Number with the M-PESA Express/STKpush API.
                  - listitem [ref=e797]:
                    - text: "Ensure the parameters are set as below:"
                    - list [ref=e798]:
                      - listitem [ref=e799]: "BusinessShortCode: Short code used on Go Live (HO/store number)"
                      - listitem [ref=e800]: "PartyB: Till Number"
                      - listitem [ref=e801]: "TransactionType: CustomerBuyGoodsOnline"
      - generic [ref=e30]:
        - paragraph [ref=e31]: Daraja 3.0
        - paragraph [ref=e32]: Daraja 3.0 is a web platform that offers access to Safaricom and M-PESA APIs that creates a bridge for payment integration to web and mobile apps. By connecting to our APIs, you open a world of possibilities to you and your clients. Together, we can transform lives.
