            - heading "How To" [level=2] [ref=e548]
            - paragraph [ref=e549]:
              - strong [ref=e550]: Access to the M-PESA Organization Portal and create Users
            - paragraph [ref=e551]: The M-PESA organization portal is a platform designed for businesses and organizations to manage their financial transactions through the M-PESA services.
            - paragraph [ref=e552]: "The portal offers various features for businesses, including:"
            - list [ref=e553]:
              - listitem [ref=e554]: "Transaction Management: Monitor and manage transactions, generate reports, and reconcile accounts."
              - listitem [ref=e555]: "Account Management: Manage multiple user accounts with different access levels within the organization."
              - listitem [ref=e556]: "Bulk Payments: Facilitate bulk payments to employees, suppliers, and other beneficiaries efficiently."
            - paragraph [ref=e557]:
              - strong [ref=e558]: Access to the M-PESA Organization Portal
            - paragraph [ref=e559]:
              - img "org-portal!" [ref=e560]
            - paragraph [ref=e561]:
              - text: To access the Organization portal (
              - link "https://org.ke.m-pesa.com/orglogin.action" [ref=e562] [cursor=pointer]:
                - /url: https://org.ke.m-pesa.com/orglogin.action
              - text: ), you need to have a Business Administrator role created under your business short code (Pay Bill/ Till).
            - paragraph [ref=e563]: The first step before getting access, is to ensure the settlement option set to your short code is Bank via a Head Office application.
            - paragraph [ref=e564]:
              - text: To make an application for a Head Office for your short code/Store Number kindly contact
              - link "M-PESABusiness@Safaricom.co.ke" [ref=e565] [cursor=pointer]:
                - /url: mailto:M-PESABusiness@Safaricom.co.ke
              - text: where they will provide you with the forms to be filled.
            - paragraph [ref=e566]:
              - text: After Head Office is created the
              - link "M-PESABusiness@Safaricom.co.ke" [ref=e567] [cursor=pointer]:
                - /url: mailto:M-PESABusiness@Safaricom.co.ke
              - text: will also guide on the creation of the Business Administrator (username).
            - paragraph [ref=e568]:
              - strong [ref=e569]: "How to login to M-PESA Organization Portal For the first time:"
            - list [ref=e570]:
              - listitem [ref=e571]:
                - text: "Launch the link from any of the browsers:"
                - link "https://org.ke.m-pesa.com" [ref=e572] [cursor=pointer]:
                  - /url: https://org.ke.m-pesa.com
                - text: .
              - listitem [ref=e573]: Enter the Short code which is Bulk payment number.
              - listitem [ref=e574]: Enter the Business Administrator username received
            - paragraph [ref=e575]:
              - text: To make an application for a Head Office for your short code/Store Number kindly contact
              - link "M-PESABusiness@Safaricom.co.ke" [ref=e576] [cursor=pointer]:
                - /url: mailto:M-PESABusiness@Safaricom.co.ke
              - text: where they will provide you with the forms to be filled. After Head Office is created, the
              - link "M-PESABusiness@Safaricom.co.ke" [ref=e577] [cursor=pointer]:
                - /url: mailto:M-PESABusiness@Safaricom.co.ke
              - text: will also guide on the creation of the Business Administrator (username).
            - heading "How to login to M-PESA Organization Portal For the first time:" [level=2] [ref=e578]
            - list [ref=e579]:
              - listitem [ref=e580]:
                - text: "Launch the link from any of the browsers:"
                - link "https://org.ke.m-pesa.com" [ref=e581] [cursor=pointer]:
                  - /url: https://org.ke.m-pesa.com
                - text: .
              - listitem [ref=e582]: Enter the Short code which is Bulk payment number.
              - listitem [ref=e583]: Enter the Business Administrator username received on email.
              - listitem [ref=e584]: Enter the first-time password received on the same email – the Password is case-sensitive (full stop is not part of the password).
              - listitem [ref=e585]: Enter the Verification Code displayed then click login, on the Next Page.
              - listitem [ref=e586]: Enter OTP to proceed to the change password page.
              - listitem [ref=e587]: Enter the first-time password on email, then proceed to set a new password.
              - listitem [ref=e588]: Confirm password, security question, and security answer one and two which are mandatory.
              - listitem [ref=e589]: The Password must meet the password rules as instructed.
              - listitem [ref=e590]: Submit to successfully activate the Business Administrator account.
              - listitem [ref=e591]: After activation, you will only be entering your username, shortcode, and password verification code and entering the OTP received via SMS to log in.
            - heading "Account Types in C2B Organization" [level=2] [ref=e592]
            - list [ref=e593]:
              - listitem [ref=e594]:
                - paragraph [ref=e595]:
                  - strong [ref=e596]: MMF/WORKING/M-PESA ACCOUNT FOR ORGANIZATION
                - list [ref=e597]:
                  - listitem [ref=e598]: When an organization wants to make a business withdrawal, the funds are transferred to this account before the withdrawal request is made.
              - listitem [ref=e599]:
                - paragraph [ref=e600]:
                  - strong [ref=e601]: UTILITY ACCOUNT
                - list [ref=e602]:
                  - listitem [ref=e603]: Payments from customers are credited into the utility account.
              - listitem [ref=e604]:
                - paragraph [ref=e605]:
                  - strong [ref=e606]: CHARGES PAID ACCOUNT
                - list [ref=e607]:
                  - listitem [ref=e608]: For payments received from customers, depending on the tariff, a charge is levied on the Organization or is split between the organization and the customer. The charges paid account is debited and always accrues a negative balance which has to be settled before an organization can make a withdrawal request.
              - listitem [ref=e609]:
                - paragraph [ref=e610]:
                  - strong [ref=e611]: ORGANIZATION SETTLEMENT ACCOUNT
                - list [ref=e612]:
                  - listitem [ref=e613]: This account does the calculations for the organization operator when s/he initiates a revenue settlement. This account settles the charges paid account and then moves the balance from the Utility Account to the MMF account automatically. You will notice that the transaction type “Move funds from Utility to MMF” is no longer available as the revenue settlement process takes care of this.
            - heading "Various Roles under the portal" [level=2] [ref=e614]
            - heading "Business Administrator role" [level=3] [ref=e615]
            - paragraph [ref=e616]: The Business Administrator role is crucial for managing and overseeing user activities within the portal.
            - paragraph [ref=e617]:
              - strong [ref=e618]: "Responsibilities of a Business Administrator:"
            - list [ref=e619]:
              - listitem [ref=e620]:
                - text: "Create other system users and give them roles depending on what he/she wants them to do within the portal. The roles include:"
                - list [ref=e621]:
                  - listitem [ref=e622]: A Business Web Operator who can initiate transactions, access statements, and check balance.
                  - listitem [ref=e623]: A business manager.
                  - listitem [ref=e624]: A Business Auditor – View Only/ Read Only Rights.
              - listitem [ref=e625]: Not able to view transactions.
              - listitem [ref=e626]:
                - text: User created by Safaricom (
                - link "M-PESABusiness@Safaricom.co.ke" [ref=e627] [cursor=pointer]:
                  - /url: mailto:M-PESABusiness@Safaricom.co.ke
                - text: ).
            - heading "Business Manager" [level=3] [ref=e628]
            - paragraph [ref=e629]: The Business manager approves transactions, checks balances, and access statements.
            - paragraph [ref=e630]:
              - strong [ref=e631]: "Responsibilities of a Business Manager:"
            - list [ref=e632]:
              - listitem [ref=e633]: The user can View statements.
              - listitem [ref=e634]: The user can initiate transactions.
              - listitem [ref=e635]: The user can Approve/reject other transactions.
              - listitem [ref=e636]: The user can withdraw funds from M-PESA.
            - paragraph [ref=e637]:
              - strong [ref=e638]: "Proceed as below to create a business manager:"
            - list [ref=e639]:
              - listitem [ref=e640]: Log in the Organization portal as the Business administrator.
              - listitem [ref=e641]: Select operators.
            - paragraph [ref=e642]:
              - img "select-operator!" [ref=e643]
            - list [ref=e644]:
              - listitem [ref=e645]: Then click the add option.
              - listitem [ref=e646]: It will take you to a new page where you will enter the username of the operator.
              - listitem [ref=e647]: Select access channel as Web.
            - paragraph [ref=e648]:
              - img "access-channel!" [ref=e649]
            - list [ref=e650]:
              - listitem [ref=e651]: Then select web profile default rule profile.
              - listitem [ref=e652]: Then assign role...Business Manager and Set Restricted ORG API PASSWORD.
            - paragraph [ref=e653]:
              - img "assign-role!" [ref=e654]
            - list [ref=e655]:
              - listitem [ref=e656]: Enter the KYC information of the operator then submit.
            - heading "API user creation" [level=3] [ref=e657]
            - paragraph [ref=e658]:
              - strong [ref=e659]: "Proceed as below to create an API Operator:"
            - list [ref=e660]:
              - listitem [ref=e661]: Log in as the Business administrator.
              - listitem [ref=e662]: Select operators.
            - paragraph [ref=e663]:
              - img "select-operator!" [ref=e664]
            - list [ref=e665]:
              - listitem [ref=e666]: Then click the add option.
              - listitem [ref=e667]: It will take you to a new page where you will enter the username of the API initiator.
              - listitem [ref=e668]: Select access channel as API.
              - listitem [ref=e669]: Then select web profile default rule profile.
              - listitem [ref=e670]: Then assign role...look for the ORG B2C API initiator, Balance Query ORG API, Transaction Status query ORG API roles.
            - paragraph [ref=e671]:
              - img "assign-api-role!" [ref=e672]
            - list [ref=e673]:
              - listitem [ref=e674]: Enter the KYC information of the operator then submit.
            - paragraph [ref=e675]:
              - strong [ref=e676]: "Here is how to set the password for the API user:"
            - list [ref=e677]:
              - listitem [ref=e678]: Login as User with the Set Restrict Password Role i.e. The Business Manager.
            - paragraph [ref=e679]:
              - img "Operator Management!" [ref=e680]
            - list [ref=e681]:
              - listitem [ref=e682]: Click on My Functions, Then Operator Management.
              - listitem [ref=e683]: Enter the API username to search after it populates the API user, At the end click on operations.
              - listitem [ref=e684]: Then click on set password avoid such (@ or.) in the setting of this password.
            - paragraph [ref=e685]:
              - img "set-password.!" [ref=e686]
